name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run verify
      - run: npm run desktop:build
      - name: Normaliser les noms
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "SocialBrand-Studio-Setup-$version-x64.exe"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "SocialBrand-Studio-$version-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: SocialBrand-Studio-${{ github.sha }}-windows-x64
          path: |
            SocialBrand-Studio-Setup-*-x64.exe
            SocialBrand-Studio-*-x64.msi
          retention-days: 30
