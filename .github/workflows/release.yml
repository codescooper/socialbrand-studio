name: Release Windows
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run verify
      - name: Vérifier le tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Le tag ne correspond pas à la version $version" }
      - run: npm run desktop:build
      - name: Préparer les artefacts et checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/bundle/nsis/*-setup.exe" "SocialBrand-Studio-Setup-$version-x64.exe"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "SocialBrand-Studio-$version-x64.msi"
          Get-FileHash SocialBrand-Studio-*.exe,SocialBrand-Studio-*.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
      - name: Créer la GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" SocialBrand-Studio-*.exe SocialBrand-Studio-*.msi SHA256SUMS.txt --title "SocialBrand Studio ${{ github.ref_name }} — Bêta Windows" --notes-file CHANGELOG.md --verify-tag
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            SocialBrand-Studio-*.exe
            SocialBrand-Studio-*.msi
            SHA256SUMS.txt
          retention-days: 30
