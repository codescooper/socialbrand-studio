[package]
name = "socialbrand-studio"
version = "0.1.0"
description = "Studio desktop de création de visuels pour les réseaux sociaux"
authors = ["AWEMA"]
license = "Proprietary"
repository = "https://github.com/codescooper/socialbrand-studio"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "socialbrand_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }
log = "=0.4.33"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "=2.8.0"
tauri-plugin-opener = "=2.5.4"
